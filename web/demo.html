<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Agent Demo</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --text: #1b1b1a; --muted: #6b6b66; --line: #e4e3df;
    --accent: #2f5bd3; --accent-text: #ffffff; --live: #d23f3f; --ok: #2f8a4c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --surface: #1d1d1b; --text: #ecebe6; --muted: #9a9993; --line: #2e2e2b;
      --accent: #7d9cf0; --accent-text: #0f1424; --live: #f07272; --ok: #6cc48a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .engines { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .engines button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: .9rem; cursor: pointer; }
  .engines button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .engines button:disabled { opacity: .5; cursor: not-allowed; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; text-align: center; }
  #talk { width: 120px; height: 120px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-text); font: 600 1rem system-ui, sans-serif; cursor: pointer; transition: transform .15s; }
  #talk:active { transform: scale(.97); }
  #talk.live { background: var(--live); }
  #status { margin: 16px 0 0; color: var(--muted); min-height: 1.5em; }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: middle; }
  #status.speaking .dot { background: var(--accent); }
  #status.listening .dot { background: var(--ok); }
  .stats { display: flex; justify-content: center; gap: 24px; margin-top: 12px; font-size: .85rem; color: var(--muted); }
  .stats { flex-wrap: wrap; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  #log { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; line-height: 1.45; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-text); }
  .msg.agent { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); }
  .msg.note { align-self: center; color: var(--muted); font-size: .85rem; background: none; padding: 0; }
  footer { margin-top: 32px; color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Talk to Santiago's AI assistant</h1>
  <p class="sub">Ask about his experience, projects or background, in English or Spanish. It's an AI, not Santiago.</p>

  <div class="engines" role="group" aria-label="Voice engine">
    <button data-engine="managed" aria-pressed="true">A · ElevenLabs</button>
    <button data-engine="open" aria-pressed="false">B · Open source</button>
  </div>

  <div class="card">
    <button id="talk" aria-live="polite">Start</button>
    <p id="status"><span class="dot"></span><span id="status-text">Ready. Uses your microphone; calls last up to 3 minutes.</span></p>
    <div class="stats">
      <span>Last reply after <b id="lat">–</b></span>
      <span id="parts-wrap" hidden>Hearing <b id="t-stt">–</b> · Thinking <b id="t-llm">–</b> · Voice <b id="t-tts">–</b></span>
      <span>Elapsed <b id="clock">0:00</b></span>
    </div>
  </div>

  <div id="log" aria-live="polite"></div>
  <footer id="foot"></footer>
</main>

<script type="module">
  import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.27.0/+esm";

  const $ = (id) => document.getElementById(id);
  const talk = $("talk"), log = $("log"), statusEl = $("status"), statusText = $("status-text");
  const MAX_CALL_MS = 180_000; // same 3-minute cap as the ElevenLabs agent
  const FOOTERS = {
    managed: "Engine A: ElevenLabs speech + Santiago's brain (Claude). Nothing is recorded by this page.",
    open: "Engine B: Silero VAD + Whisper (on Groq) + Santiago's brain (Claude) + an open-source voice: Kokoro in your browser on computers with WebGPU, Orpheus (on Groq) elsewhere. Spanish uses your device's voice. Nothing is recorded by this page.",
  };
  let engine = new URLSearchParams(location.search).get("engine") === "open" ? "open" : "managed";
  let call = null, startedAt = null, timer = null;

  const say = (role, text) => {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    log.append(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  };
  const setStatus = (mode, text) => { statusEl.className = mode; statusText.textContent = text; };
  const secs = (ms) => `${(ms / 1000).toFixed(1)} s`;

  function setEngine(next) {
    engine = next;
    document.querySelectorAll(".engines button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.engine === engine)));
    $("parts-wrap").hidden = engine !== "open";
    $("foot").textContent = FOOTERS[engine];
  }
  document.querySelectorAll(".engines button").forEach((b) => b.addEventListener("click", () => !call && setEngine(b.dataset.engine)));
  setEngine(engine);

  function startClock() {
    startedAt = Date.now();
    timer = setInterval(() => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      $("clock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      if (engine === "open" && Date.now() - startedAt > MAX_CALL_MS) end("Call ended (3-minute limit).");
    }, 500);
    talk.textContent = "End";
    talk.classList.add("live");
    talk.disabled = false;
  }

  function stopUi(text) {
    clearInterval(timer);
    call = null;
    talk.textContent = "Start";
    talk.classList.remove("live");
    talk.disabled = false;
    document.querySelectorAll(".engines button").forEach((b) => (b.disabled = false));
    setStatus("", text);
  }

  async function end(text = "Call ended.") {
    const c = call;
    if (!c) return;
    talk.disabled = true;
    await c.end();
    stopUi(text);
  }

  // ---------- Engine A: ElevenLabs does listening, turn-taking and voice over WebRTC ----------
  async function startManaged() {
    let userDoneAt = null;
    const r = await fetch("/api/eleven-session", { method: "POST" });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || `session failed (${r.status})`);
    setStatus("", "Connecting…");
    const convo = await Conversation.startSession({
      conversationToken: body.token,
      connectionType: "webrtc",
      onConnect: startClock,
      onDisconnect: () => stopUi("Call ended."),
      onError: (message) => { console.error(message); say("note", `Error: ${message}`); },
      onMessage: ({ source, message }) => {
        if (source === "user") userDoneAt = performance.now();
        say(source === "user" ? "user" : "agent", message);
      },
      onModeChange: ({ mode }) => {
        if (mode === "speaking") {
          if (userDoneAt) $("lat").textContent = secs(performance.now() - userDoneAt);
          userDoneAt = null;
          setStatus("speaking", "Speaking… (you can interrupt)");
        } else setStatus("listening", "Listening…");
      },
    });
    return { end: () => convo.endSession() };
  }

  // ---------- Engine B: open-source parts wired together in the page ----------
  // Mic → Silero VAD (browser) → /api/stt (Whisper) → /api/llm (brain, streamed) → sentences
  // → Kokoro in a worker (English) or speechSynthesis (Spanish / fallback) → speakers.
  const GREETING = {
    en: "Hi! I'm Santiago's AI assistant. Ask me anything about his experience, projects or background, in English or Spanish.",
  };
  const KOKORO_VOICE = "af_heart";
  const ORT = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.3/dist/";
  const VAD = "https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/";

  const loadScript = (src) => new Promise((ok, fail) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const el = Object.assign(document.createElement("script"), { src, onload: ok, onerror: () => fail(new Error(`could not load ${src}`)) });
    document.head.append(el);
  });

  // Kokoro lives across calls so the model only loads once per page. It needs WebGPU to keep
  // up with speech, and its ~330 MB download is too much for phones on data: those get the
  // device's own voice instead.
  const kokoroUsable = !!navigator.gpu && !(navigator.userAgentData?.mobile ?? /Mobi|Android|iPhone|iPad/.test(navigator.userAgent));
  let kokoro = null;
  function getKokoro() {
    if (!kokoroUsable) return { ready: false, failed: true, loaded: Promise.resolve(false) };
    if (kokoro) return kokoro;
    const worker = new Worker("/web/kokoro-worker.js", { type: "module" });
    const pending = new Map();
    kokoro = { ready: false, failed: false, speak: null };
    kokoro.loaded = new Promise((ok) => {
      worker.onmessage = ({ data }) => {
        if (data.type === "ready") { kokoro.ready = true; ok(true); }
        else if (data.type === "progress" && data.total && !kokoro.ready && /onnx/.test(data.file || ""))
          kokoro.progress = Math.round((100 * data.loaded) / data.total);
        else if (data.type === "audio") { pending.get(data.id)?.ok(data); pending.delete(data.id); }
        else if (data.type === "error") {
          if (data.id == null) { kokoro.failed = true; console.warn("Kokoro failed to load:", data.error); ok(false); }
          else { pending.get(data.id)?.fail(new Error(data.error)); pending.delete(data.id); }
        }
      };
      worker.onerror = (e) => { kokoro.failed = true; console.warn("Kokoro worker error:", e.message); ok(false); };
    });
    let n = 0;
    kokoro.speak = (text) => new Promise((ok, fail) => { const id = ++n; pending.set(id, { ok, fail }); worker.postMessage({ type: "speak", id, text, voice: KOKORO_VOICE }); });
    worker.postMessage({ type: "load" });
    return kokoro;
  }

  function systemVoice(lang) {
    const voices = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith(lang));
    return voices.find((v) => /419|MX|US/.test(v.lang) && v.localService) || voices.find((v) => v.localService) || voices[0] || null;
  }

  async function startOpen(audioCtx) {
    setStatus("", "Loading the listener…");
    const tts = getKokoro();
    await loadScript(ORT + "ort.wasm.min.js");
    await loadScript(VAD + "bundle.min.js");

    const messages = [{ role: "assistant", content: GREETING.en }];
    let gen = 0;               // bumps on every interruption; stale work checks it and stops
    let speaking = 0;          // sentences queued or playing
    const live = new Set();    // Kokoro clips scheduled or playing
    let nextAt = 0;            // audio-clock time where the next clip starts
    let playChain = Promise.resolve();
    let controller = null;
    let mark = {};             // timestamps for the latency readout of the current turn

    const idle = () => { if (!speaking && call) setStatus("listening", "Listening…"); };
    const firstSound = (g) => {
      if (g !== gen || mark.spoke) return;
      mark.spoke = performance.now();
      if (mark.end) {
        $("lat").textContent = secs(mark.spoke - mark.end);
        $("t-tts").textContent = secs(mark.spoke - mark.firstText);
      }
      setStatus("speaking", "Speaking… (you can interrupt)");
    };

    // Kokoro pads every clip with ~0.3 s of silence before and ~0.47 s after, which left
    // ~0.8 s of dead air between sentences. Keep just enough for a natural pause.
    function trimSilence(audio, rate) {
      let a = 0, b = audio.length - 1;
      while (a < b && Math.abs(audio[a]) < 0.01) a++;
      while (b > a && Math.abs(audio[b]) < 0.01) b--;
      return audio.subarray(Math.max(0, a - 0.05 * rate), Math.min(audio.length, b + 0.12 * rate));
    }

    // Clips are placed back to back on the audio clock, so the next one is queued before the
    // current one ends. Resolves when the clip finishes (or is stopped).
    function schedulePcm(audio, rate, g) {
      const pcm = trimSilence(audio, rate);
      const buf = audioCtx.createBuffer(1, pcm.length, rate);
      buf.copyToChannel(pcm, 0);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      const at = Math.max(audioCtx.currentTime + 0.03, nextAt);
      src.start(at);
      nextAt = at + buf.duration;
      live.add(src);
      setTimeout(() => firstSound(g), (at - audioCtx.currentTime) * 1000);
      return new Promise((done) => (src.onended = () => { live.delete(src); done(); }));
    }

    function speakSystem(text, lang, g) {
      return new Promise((done) => {
        if (g !== gen) return done();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang === "es" ? "es-419" : "en-US";
        u.voice = systemVoice(lang);
        u.onstart = () => firstSound(g);
        u.onend = u.onerror = () => done();
        speechSynthesis.speak(u);
      });
    }

    // Where Kokoro can't run (phones, no WebGPU), English goes to Orpheus on the server
    // (/api/tts). The first failure turns it off for the rest of the call.
    let serverTts = true;
    async function speakServer(text) {
      if (!serverTts) return null;
      try {
        const r = await fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
        if (!r.ok) throw new Error("tts " + r.status);
        const buf = await audioCtx.decodeAudioData(await r.arrayBuffer());
        return { audio: buf.getChannelData(0), rate: buf.sampleRate };
      } catch (err) {
        serverTts = false;
        console.warn("Server voice unavailable, using the device voice:", err.message);
        return null;
      }
    }

    // Synthesis starts as soon as a chunk arrives; playback stays in order.
    function enqueue(text, lang, g) {
      speaking++;
      const finished = () => { speaking--; idle(); };
      const clip = lang !== "en" ? null
        : tts.ready ? tts.speak(text).catch(() => null)
        : !kokoroUsable ? speakServer(text)
        : null;
      playChain = playChain.then(async () => {
        const out = g === gen && clip && (await clip);
        if (g !== gen) return finished();
        if (out) { schedulePcm(out.audio, out.rate, g).then(finished); return; }
        // System voice: let any queued Kokoro audio finish first, then speak and wait.
        await new Promise((r) => setTimeout(r, Math.max(0, (nextAt - audioCtx.currentTime) * 1000)));
        if (g === gen) await speakSystem(text, lang, g);
        finished();
      });
    }

    function interrupt() {
      gen++;
      controller?.abort();
      for (const src of live) try { src.stop(); } catch {}
      live.clear();
      nextAt = 0;
      speechSynthesis.cancel();
    }

    async function turn(audio) {
      interrupt();
      const g = gen;
      mark = { end: performance.now() };
      ["lat", "t-stt", "t-llm", "t-tts"].forEach((id) => ($(id).textContent = "…"));
      setStatus("", "Transcribing…");
      controller = new AbortController();
      const { signal } = controller;
      try {
        const wav = vad.utils.encodeWAV(audio, 1, 16000, 1, 16);
        const sr = await fetch("/api/stt", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: wav, signal });
        const heard = await sr.json();
        if (!sr.ok) throw new Error(heard.error || `transcription failed (${sr.status})`);
        $("t-stt").textContent = secs(performance.now() - mark.end);
        if (g !== gen) return;
        if (heard.text.replace(/[^\p{L}\p{N}]/gu, "").length < 2) return idle();
        say("user", heard.text);
        messages.push({ role: "user", content: heard.text });

        setStatus("", "Thinking…");
        mark.asked = performance.now();
        const lr = await fetch("/api/llm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages, stream: true }),
          signal,
        });
        if (!lr.ok) throw new Error((await lr.json().catch(() => ({}))).error || `brain failed (${lr.status})`);

        const bubble = say("agent", "");
        let full = "", pending = "", sse = "", chunks = 0;
        const flush = (force) => {
          // Cut at sentence ends. The first chunk is short so the voice starts fast; later
          // ones group sentences (fewer seams, better intonation). A boundary needs a space
          // after it, so "1.25" and a "." that just streamed in don't count yet.
          for (;;) {
            const min = chunks === 0 ? 25 : 140;
            const re = /[.!?…](?=\s)/g;
            let cut = -1, m;
            while ((m = re.exec(pending))) if (m.index + 1 >= min) { cut = m.index + 1; break; }
            if (cut < 0) break;
            enqueue(pending.slice(0, cut).trim(), heard.lang, g);
            chunks++;
            pending = pending.slice(cut);
          }
          if (force && pending.trim()) { enqueue(pending.trim(), heard.lang, g); pending = ""; }
        };
        const reader = lr.body.getReader();
        const dec = new TextDecoder();
        for (;;) {
          const { value, done } = await reader.read();
          if (done || g !== gen) break;
          sse += dec.decode(value, { stream: true });
          const lines = sse.split("\n");
          sse = lines.pop();
          for (const line of lines) {
            if (!line.startsWith("data: ") || line === "data: [DONE]") continue;
            const text = JSON.parse(line.slice(6)).choices?.[0]?.delta?.content;
            if (!text) continue;
            if (!mark.firstText) { mark.firstText = performance.now(); $("t-llm").textContent = secs(mark.firstText - mark.asked); }
            full += text;
            pending += text;
            bubble.textContent = full;
            flush(false);
          }
        }
        if (g === gen) flush(true);
        if (full) messages.push({ role: "assistant", content: full }); // partial if interrupted
      } catch (err) {
        if (err.name === "AbortError") return;
        console.error(err);
        say("note", err.message);
        idle();
      }
    }

    const mic = await vad.MicVAD.new({
      model: "v5",
      baseAssetPath: VAD,
      onnxWASMBasePath: ORT,
      redemptionMs: 700,   // silence that ends a turn; the 1.4 s default feels sluggish
      minSpeechMs: 300,
      onSpeechRealStart: () => { interrupt(); setStatus("listening", "Listening…"); },
      onSpeechEnd: (audio) => turn(audio),
    });

    // The greeting doesn't wait for Kokoro: it uses Kokoro only if the model is cached.
    await Promise.race([tts.loaded, new Promise((r) => setTimeout(r, 1500))]);
    mic.start();
    startClock();
    say("agent", GREETING.en);
    enqueue(GREETING.en, "en", gen);
    if (!kokoroUsable) say("note", "This device can't run the in-browser voice (it needs WebGPU on a computer), so the open-source Orpheus voice speaks from the server.");
    else if (!tts.ready && !tts.failed) {
      const note = say("note", "Loading the open-source voice (about 330 MB, once). Your device's voice fills in until then.");
      const tick = setInterval(() => {
        if (tts.ready || tts.failed || !call) {
          clearInterval(tick);
          note.textContent = tts.ready ? "Open-source voice loaded." : tts.failed ? "The open-source voice couldn't load here; using your device's voice." : note.textContent;
        } else if (tts.progress != null) note.textContent = `Loading the open-source voice… ${tts.progress}%`;
      }, 400);
    }

    return {
      end: async () => {
        interrupt();
        await mic.destroy();
        await audioCtx.close();
      },
    };
  }

  async function start() {
    talk.disabled = true;
    document.querySelectorAll(".engines button").forEach((b) => (b.disabled = true));
    setStatus("", "Asking for your microphone…");
    // Browsers only allow sound from an audio context created during the click itself.
    const audioCtx = engine === "open" ? new AudioContext() : null;
    // Phones (iOS especially) also mute speechSynthesis unless it first speaks inside a click.
    if (engine === "open") speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(" "), { volume: 0 }));
    try {
      await navigator.mediaDevices.getUserMedia({ audio: true }).then((s) => s.getTracks().forEach((t) => t.stop()));
      call = await (engine === "open" ? startOpen(audioCtx) : startManaged());
    } catch (err) {
      audioCtx?.close();
      say("note", err.name === "NotAllowedError" ? "Microphone access was blocked." : err.message);
      stopUi("Ready.");
    }
  }

  talk.addEventListener("click", () => (call ? end() : start()));
</script>
</body>
</html>
